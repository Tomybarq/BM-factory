name: Continuous Integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, tests, coverage, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage -- --reporter=dot --reporter=json --outputFile.json=test-results.json

      - name: Build production bundle
        run: npm run build

      - name: Add coverage summary to job summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
          const all = summary.total;
          const pct = (metric) => `${metric.pct}%`;
          console.log('## Code Coverage');
          console.log('');
          console.log('| Metric | Coverage |');
          console.log('| --- | ---: |');
          console.log(`| Statements | ${pct(all.statements)} |`);
          console.log(`| Branches | ${pct(all.branches)} |`);
          console.log(`| Functions | ${pct(all.functions)} |`);
          console.log(`| Lines | ${pct(all.lines)} |`);
          NODE

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node-${{ github.run_number }}
          path: |
            coverage
            test-results.json
          if-no-files-found: ignore
          retention-days: 14
